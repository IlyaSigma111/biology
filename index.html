<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ Chess.com Clone — Играйте в шахматы онлайн</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --chess-green: #7FA650;
            --chess-dark: #312E2B;
            --chess-light: #F0F0F0;
            --chess-gold: #FFD700;
            --chess-red: #C24E4E;
            --chess-blue: #4A90E2;
            --white-square: #EBECD0;
            --black-square: #779556;
            --highlight: rgba(255, 255, 0, 0.4);
            --move-hint: rgba(0, 255, 0, 0.3);
        }

        /* ===== BASE ===== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--chess-dark);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== LOADING ===== */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--chess-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .chess-logo {
            font-size: 80px;
            color: var(--chess-green);
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--chess-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            display: none;
        }

        /* ===== TOP BAR (Mobile First) ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 24px;
            color: var(--chess-green);
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 600;
            color: white;
        }

        .game-controls-top {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: var(--chess-green);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn:hover {
            background: #6d8f47;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--chess-green);
            color: var(--chess-green);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 13px;
        }

        /* ===== MOBILE OPTIMIZED LAYOUT ===== */
        .mobile-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Board for mobile */
        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        #chess-board {
            width: 100%;
            aspect-ratio: 1/1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Desktop layout */
        @media (min-width: 768px) {
            .mobile-layout {
                display: grid;
                grid-template-columns: 1fr 300px;
                gap: 20px;
            }
            
            .board-wrapper {
                max-width: 600px;
            }
            
            .top-bar {
                padding: 15px 25px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 15px;
            }
        }

        @media (min-width: 1200px) {
            .mobile-layout {
                grid-template-columns: 1fr 350px;
            }
            
            .board-wrapper {
                max-width: 650px;
            }
        }

        /* ===== SQUARES & PIECES ===== */
        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .square.light {
            background-color: var(--white-square);
        }

        .square.dark {
            background-color: var(--black-square);
        }

        .square.highlight {
            background-color: var(--highlight) !important;
        }

        .square.possible-move::after {
            content: '';
            position: absolute;
            width: 25%;
            height: 25%;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            pointer-events: none;
        }

        .square.possible-capture {
            background: linear-gradient(45deg, 
                transparent 0%, 
                transparent 49%, 
                rgba(0,0,0,0.1) 50%, 
                transparent 51%, 
                transparent 100%);
        }

        .piece {
            font-size: calc(min(8vw, 60px));
            cursor: grab;
            user-select: none;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            z-index: 10;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }

        .piece.dragging {
            transform: scale(1.1);
            z-index: 100;
            opacity: 0.9;
        }

        /* Black pieces are now actually black */
        .piece.black {
            color: #2C2C2C;
            text-shadow: 0 0 2px rgba(255,255,255,0.5);
        }

        .piece.white {
            color: white;
            text-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        /* ===== PLAYER INFO ===== */
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .player-info.active {
            background: rgba(127, 166, 80, 0.2);
            border-left: 4px solid var(--chess-green);
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--chess-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .player-details {
            flex: 1;
        }

        .player-name {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .player-time {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
        }

        /* ===== GAME STATUS ===== */
        .game-status-bar {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            font-weight: 600;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== SIDEBAR PANELS ===== */
        .panel {
            background: rgba(0,0,0,0.6);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .panel-header h3 {
            font-size: 16px;
            color: var(--chess-green);
        }

        /* Move History */
        .moves-container {
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 10px;
        }

        .move-row {
            display: grid;
            grid-template-columns: 30px 1fr 1fr;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .move-row:nth-child(odd) {
            background: rgba(255,255,255,0.05);
        }

        .move-row.current {
            background: rgba(127, 166, 80, 0.3);
        }

        .move-number {
            color: #999;
            font-weight: 600;
        }

        .move-white, .move-black {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .move-white:hover, .move-black:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Chat */
        .chat-messages {
            height: 180px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            max-width: 90%;
        }

        .message.system {
            background: rgba(74, 144, 226, 0.2);
            text-align: center;
            max-width: 100%;
        }

        .message.own {
            background: rgba(127, 166, 80, 0.3);
            margin-left: auto;
        }

        .message.opponent {
            background: rgba(255,255,255,0.1);
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
        }

        .chat-input button {
            padding: 10px 15px;
            background: var(--chess-green);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--chess-dark);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--chess-green);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header h2 {
            color: var(--chess-green);
            font-size: 22px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #999;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        /* Game Modes */
        .game-modes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }

        .mode-option {
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .mode-option:hover {
            background: rgba(255,255,255,0.1);
        }

        .mode-option.selected {
            background: rgba(127, 166, 80, 0.2);
            border-color: var(--chess-green);
        }

        .mode-icon {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--chess-green);
        }

        .mode-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .mode-time {
            font-size: 12px;
            color: #999;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 15px;
        }

        select.form-control {
            cursor: pointer;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--chess-green);
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideInRight 0.3s;
            max-width: 300px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== PROMOTION MODAL ===== */
        .promotion-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid var(--chess-green);
            z-index: 100;
            display: none;
        }

        .promotion-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .promotion-piece {
            font-size: 30px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .promotion-piece:hover {
            background: var(--chess-green);
            transform: scale(1.1);
        }

        /* ===== BOTTOM CONTROLS ===== */
        .bottom-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 15px;
        }

        .control-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .control-btn i {
            font-size: 16px;
        }

        /* ===== ONLINE GAMES LIST ===== */
        .games-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .game-item {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-players {
            font-size: 14px;
        }

        .game-time {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #999;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--chess-green);
            border-radius: 3px;
        }

        /* ===== UTILITIES ===== */
        .text-center { text-align: center; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="chess-logo">♔</div>
        <div class="loader"></div>
        <p style="margin-top: 15px; color: #ccc;">Загрузка шахмат...</p>
    </div>

    <!-- Main App -->
    <div class="container" id="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo">
                <i class="fas fa-chess-king"></i>
                <h1>Chess.com Clone</h1>
            </div>
            <div class="game-controls-top">
                <button class="btn btn-small" onclick="showModal('newGameModal')">
                    <i class="fas fa-plus"></i> Новая игра
                </button>
                <button class="btn btn-outline btn-small" onclick="showModal('onlineModal')">
                    <i class="fas fa-globe"></i> Онлайн
                </button>
                <button class="btn btn-small" onclick="showModal('friendsModal')">
                    <i class="fas fa-user-friends"></i> С друзьями
                </button>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="mobile-layout">
            <!-- Left: Board -->
            <div>
                <!-- Board -->
                <div class="board-wrapper">
                    <div id="chess-board"></div>
                    
                    <!-- Promotion Modal -->
                    <div class="promotion-modal" id="promotionModal">
                        <div class="promotion-options" id="promotionOptions"></div>
                    </div>
                </div>

                <!-- Game Status -->
                <div class="game-status-bar" id="gameStatus">
                    Выберите режим игры
                </div>

                <!-- Players -->
                <div class="player-info" id="whitePlayerInfo">
                    <div class="player-avatar">⚪</div>
                    <div class="player-details">
                        <div class="player-name" id="whitePlayerName">Белые</div>
                        <div class="player-time" id="whiteTimer">10:00</div>
                    </div>
                </div>

                <div class="player-info" id="blackPlayerInfo">
                    <div class="player-avatar">⚫</div>
                    <div class="player-details">
                        <div class="player-name" id="blackPlayerName">Чёрные</div>
                        <div class="player-time" id="blackTimer">10:00</div>
                    </div>
                </div>

                <!-- Bottom Controls -->
                <div class="bottom-controls">
                    <button class="control-btn" onclick="showModal('newGameModal')">
                        <i class="fas fa-plus-circle"></i> Новая
                    </button>
                    <button class="control-btn" onclick="undoMove()">
                        <i class="fas fa-undo"></i> Отмена
                    </button>
                    <button class="control-btn" onclick="getHint()">
                        <i class="fas fa-lightbulb"></i> Подсказка
                    </button>
                    <button class="control-btn" onclick="offerDraw()">
                        <i class="fas fa-handshake"></i> Ничья
                    </button>
                    <button class="control-btn" onclick="resignGame()">
                        <i class="fas fa-flag"></i> Сдаться
                    </button>
                    <button class="control-btn" onclick="toggleSound()">
                        <i class="fas fa-volume-up" id="soundIcon"></i> Звук
                    </button>
                </div>
            </div>

            <!-- Right: Sidebar -->
            <div>
                <!-- Move History -->
                <div class="panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-history"></i> История ходов</h3>
                        <button class="btn btn-small" onclick="clearHistory()" style="padding: 5px 10px;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="moves-container" id="movesContainer">
                        <div class="text-center" style="color: #999; padding: 30px 0;">
                            <i class="fas fa-chess-board fa-2x"></i>
                            <p style="margin-top: 10px;">Ходы появятся здесь</p>
                        </div>
                    </div>
                </div>

                <!-- Chat -->
                <div class="panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-comments"></i> Чат</h3>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="message system">
                            Добро пожаловать! Создайте игру или присоединитесь к существующей.
                        </div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="Сообщение..." maxlength="200">
                        <button onclick="sendChatMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <!-- Online Games -->
                <div class="panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-gamepad"></i> Активные игры</h3>
                    </div>
                    <div class="games-list" id="onlineGames">
                        <div class="text-center" style="color: #999; padding: 20px 0;">
                            <i class="fas fa-users"></i>
                            <p style="margin-top: 5px;">Загрузка игр...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="newGameModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Новая игра</h2>
                <button class="close-modal" onclick="hideModal('newGameModal')">&times;</button>
            </div>
            
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" class="form-control" id="playerName" value="Игрок">
            </div>
            
            <div class="form-group">
                <label>Режим времени</label>
                <div class="game-modes" id="timeModes">
                    <!-- Filled by JavaScript -->
                </div>
            </div>
            
            <div class="form-group">
                <label>Тип игры</label>
                <select class="form-control" id="gameType">
                    <option value="ai">Против компьютера</option>
                    <option value="friend" selected>С другом</option>
                    <option value="online">Случайный соперник</option>
                </select>
            </div>
            
            <div class="form-group" id="colorSelection">
                <label>Цвет фигур</label>
                <select class="form-control" id="playerColor">
                    <option value="random">Случайный</option>
                    <option value="white">Белые</option>
                    <option value="black">Чёрные</option>
                </select>
            </div>
            
            <div id="friendOptions" class="hidden">
                <div class="form-group">
                    <label>Код игры (для друга)</label>
                    <div class="chat-input">
                        <input type="text" id="gameCode" readonly value="CHESS-1234">
                        <button onclick="copyGameCode()">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <button class="btn" style="width: 100%; padding: 15px; margin-top: 10px;" onclick="startGame()">
                <i class="fas fa-play"></i> Начать игру
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="friendsModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-user-friends"></i> Игра с другом</h2>
                <button class="close-modal" onclick="hideModal('friendsModal')">&times;</button>
            </div>
            
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" class="form-control" id="friendName" value="Игрок">
            </div>
            
            <div class="form-group">
                <label>Создать игру</label>
                <button class="btn" style="width: 100%; padding: 15px;" onclick="createFriendGame()">
                    <i class="fas fa-plus"></i> Создать новую игру
                </button>
            </div>
            
            <div style="text-align: center; margin: 20px 0; color: #999;">ИЛИ</div>
            
            <div class="form-group">
                <label>Присоединиться к игре</label>
                <input type="text" class="form-control" id="joinGameCode" placeholder="Введите код игры">
                <button class="btn" style="width: 100%; padding: 15px; margin-top: 10px;" onclick="joinFriendGame()">
                    <i class="fas fa-sign-in-alt"></i> Присоединиться
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== GAME CONFIGURATION =====
        const CHESS_PIECES = {
            // Black pieces (lowercase) - DARK
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟',
            // White pieces (uppercase) - LIGHT
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙'
        };

        const GAME_MODES = [
            { id: 'bullet', name: 'Буллит', time: 60, increment: 1, icon: '⚡' },
            { id: 'blitz', name: 'Блиц', time: 180, increment: 2, icon: '🔥' },
            { id: 'rapid', name: 'Рапид', time: 600, increment: 5, icon: '🏃' },
            { id: 'classical', name: 'Классика', time: 1800, increment: 10, icon: '♛' },
            { id: 'correspondence', name: 'Переписка', time: 86400, increment: 0, icon: '📧' }
        ];

        const INITIAL_POSITION = {
            'a8': 'r', 'b8': 'n', 'c8': 'b', 'd8': 'q', 'e8': 'k', 'f8': 'b', 'g8': 'n', 'h8': 'r',
            'a7': 'p', 'b7': 'p', 'c7': 'p', 'd7': 'p', 'e7': 'p', 'f7': 'p', 'g7': 'p', 'h7': 'p',
            'a2': 'P', 'b2': 'P', 'c2': 'P', 'd2': 'P', 'e2': 'P', 'f2': 'P', 'g2': 'P', 'h2': 'P',
            'a1': 'R', 'b1': 'N', 'c1': 'B', 'd1': 'Q', 'e1': 'K', 'f1': 'B', 'g1': 'N', 'h1': 'R'
        };

        // ===== GAME STATE =====
        let gameState = {
            pieces: { ...INITIAL_POSITION },
            selectedSquare: null,
            currentPlayer: 'white',
            gameActive: false,
            gameMode: null,
            playerColor: 'white',
            playerName: 'Игрок',
            opponentName: 'Соперник',
            whiteTime: 600,
            blackTime: 600,
            timerInterval: null,
            moveHistory: [],
            promotionPending: null,
            soundEnabled: true,
            onlineGames: [],
            gameCode: null,
            isOnline: false
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize modals
            initTimeModes();
            
            // Load settings
            loadSettings();
            
            // Initialize board
            initBoard();
            
            // Start game loop
            requestAnimationFrame(gameLoop);
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    showNotification('Добро пожаловать в Chess.com Clone!', 'info');
                }, 500);
            }, 1000);
        });

        function initBoard() {
            const board = document.getElementById('chess-board');
            board.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.dataset.pos = `${String.fromCharCode(97 + col)}${8 - row}`;
                    
                    // Add coordinates for better UX
                    if ((row === 7 && col === 0) || (row === 0 && col === 7)) {
                        const coord = document.createElement('span');
                        coord.textContent = row === 7 ? 'a' : 'A';
                        coord.style.position = 'absolute';
                        coord.style.fontSize = '10px';
                        coord.style.color = (row + col) % 2 === 0 ? '#000' : '#fff';
                        coord.style.opacity = '0.5';
                        coord.style.pointerEvents = 'none';
                        square.appendChild(coord);
                    }
                    
                    square.addEventListener('click', () => handleSquareClick(square));
                    
                    // Drag and drop support
                    square.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (gameState.selectedSquare) {
                            square.classList.add('highlight');
                        }
                    });
                    
                    square.addEventListener('dragleave', () => {
                        square.classList.remove('highlight');
                    });
                    
                    square.addEventListener('drop', (e) => {
                        e.preventDefault();
                        if (gameState.selectedSquare) {
                            handleMove(gameState.selectedSquare, square);
                        }
                    });
                    
                    board.appendChild(square);
                }
            }
            
            updateBoard();
        }

        function updateBoard() {
            // Clear all pieces
            document.querySelectorAll('.piece').forEach(piece => piece.remove());
            
            // Clear highlights
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('highlight', 'possible-move', 'possible-capture');
            });
            
            // Add pieces
            for (const [pos, pieceCode] of Object.entries(gameState.pieces)) {
                const square = getSquareElement(pos);
                if (square && pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = `piece ${pieceCode === pieceCode.toLowerCase() ? 'black' : 'white'}`;
                    piece.textContent = CHESS_PIECES[pieceCode];
                    piece.dataset.piece = pieceCode;
                    piece.draggable = true;
                    
                    piece.addEventListener('dragstart', (e) => {
                        if (gameState.gameActive) {
                            const pieceColor = pieceCode === pieceCode.toLowerCase() ? 'black' : 'white';
                            if (pieceColor === gameState.currentPlayer) {
                                gameState.selectedSquare = square;
                                piece.classList.add('dragging');
                                e.dataTransfer.setData('text/plain', pos);
                                showPossibleMoves(pos, pieceCode);
                            }
                        }
                    });
                    
                    piece.addEventListener('dragend', () => {
                        piece.classList.remove('dragging');
                    });
                    
                    square.appendChild(piece);
                }
            }
            
            // Update player indicators
            updatePlayerIndicators();
        }

        function getSquareElement(pos) {
            return document.querySelector(`.square[data-pos="${pos}"]`);
        }

        // ===== GAME LOGIC =====
        function handleSquareClick(square) {
            if (!gameState.gameActive) return;
            
            const piece = square.querySelector('.piece');
            
            if (piece) {
                // Select piece
                const pieceCode = piece.dataset.piece;
                const pieceColor = pieceCode === pieceCode.toLowerCase() ? 'black' : 'white';
                
                if (pieceColor === gameState.currentPlayer) {
                    gameState.selectedSquare = square;
                    clearHighlights();
                    square.classList.add('highlight');
                    showPossibleMoves(square.dataset.pos, pieceCode);
                }
            } else if (gameState.selectedSquare) {
                // Move piece
                handleMove(gameState.selectedSquare, square);
            }
        }

        function showPossibleMoves(pos, pieceCode) {
            const moves = getValidMoves(pos, pieceCode);
            moves.forEach(move => {
                const square = getSquareElement(move.to);
                if (square) {
                    if (gameState.pieces[move.to]) {
                        square.classList.add('possible-capture');
                    } else {
                        square.classList.add('possible-move');
                    }
                }
            });
        }

        function getValidMoves(pos, pieceCode) {
            const [file, rank] = [pos[0], parseInt(pos[1])];
            const fileIndex = file.charCodeAt(0) - 97;
            const rankIndex = 8 - rank;
            const piece = pieceCode.toLowerCase();
            const color = pieceCode === pieceCode.toLowerCase() ? 'black' : 'white';
            const moves = [];

            // Pawn moves
            if (piece === 'p') {
                const direction = color === 'white' ? 1 : -1;
                const startRank = color === 'white' ? 2 : 7;
                const promotionRank = color === 'white' ? 8 : 1;
                
                // One square forward
                const forward1 = `${file}${rank + direction}`;
                if (!gameState.pieces[forward1]) {
                    moves.push({ from: pos, to: forward1 });
                    
                    // Two squares from start
                    if (rank === startRank) {
                        const forward2 = `${file}${rank + 2 * direction}`;
                        if (!gameState.pieces[forward2]) {
                            moves.push({ from: pos, to: forward2 });
                        }
                    }
                }
                
                // Captures
                [-1, 1].forEach(fileOffset => {
                    const captureFile = String.fromCharCode(file.charCodeAt(0) + fileOffset);
                    const capturePos = `${captureFile}${rank + direction}`;
                    if (gameState.pieces[capturePos] && 
                        (gameState.pieces[capturePos] === gameState.pieces[capturePos].toLowerCase()) !== (color === 'white')) {
                        moves.push({ from: pos, to: capturePos });
                    }
                });
            }
            
            // Knight moves
            else if (piece === 'n') {
                const knightMoves = [
                    [2, 1], [2, -1], [-2, 1], [-2, -1],
                    [1, 2], [1, -2], [-1, 2], [-1, -2]
                ];
                
                knightMoves.forEach(([df, dr]) => {
                    const newFile = String.fromCharCode(file.charCodeAt(0) + df);
                    const newRank = rank + dr;
                    if (newRank >= 1 && newRank <= 8 && newFile >= 'a' && newFile <= 'h') {
                        const newPos = `${newFile}${newRank}`;
                        if (!gameState.pieces[newPos] || 
                            (gameState.pieces[newPos] === gameState.pieces[newPos].toLowerCase()) !== (color === 'white')) {
                            moves.push({ from: pos, to: newPos });
                        }
                    }
                });
            }
            
            // King moves (simplified)
            else if (piece === 'k') {
                for (let df = -1; df <= 1; df++) {
                    for (let dr = -1; dr <= 1; dr++) {
                        if (df === 0 && dr === 0) continue;
                        const newFile = String.fromCharCode(file.charCodeAt(0) + df);
                        const newRank = rank + dr;
                        if (newRank >= 1 && newRank <= 8 && newFile >= 'a' && newFile <= 'h') {
                            const newPos = `${newFile}${newRank}`;
                            if (!gameState.pieces[newPos] || 
                                (gameState.pieces[newPos] === gameState.pieces[newPos].toLowerCase()) !== (color === 'white')) {
                                moves.push({ from: pos, to: newPos });
                            }
                        }
                    }
                }
            }
            
            return moves;
        }

        function handleMove(fromSquare, toSquare) {
            const fromPos = fromSquare.dataset.pos;
            const toPos = toSquare.dataset.pos;
            const pieceCode = gameState.pieces[fromPos];
            
            if (!pieceCode) return;
            
            // Check if move is to highlighted square
            if (!toSquare.classList.contains('possible-move') && 
                !toSquare.classList.contains('possible-capture')) {
                return;
            }
            
            // Check for pawn promotion
            const piece = pieceCode.toLowerCase();
            const color = pieceCode === pieceCode.toLowerCase() ? 'black' : 'white';
            
            if (piece === 'p') {
                const promotionRank = color === 'white' ? 8 : 1;
                if (parseInt(toPos[1]) === promotionRank) {
                    showPromotionModal(fromPos, toPos, color);
                    return;
                }
            }
            
            // Execute move
            executeMove(fromPos, toPos, pieceCode);
        }

        function executeMove(fromPos, toPos, pieceCode, promotion = null) {
            // Make the move
            gameState.pieces[toPos] = promotion || pieceCode;
            delete gameState.pieces[fromPos];
            
            // Handle capture
            if (promotion) {
                playSound('promotion');
            } else if (gameState.lastMove && gameState.lastMove.piece !== pieceCode) {
                playSound('capture');
            } else {
                playSound('move');
            }
            
            // Update game state
            gameState.lastMove = { from: fromPos, to: toPos, piece: pieceCode };
            gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
            gameState.selectedSquare = null;
            
            // Add to history
            addMoveToHistory(fromPos, toPos, pieceCode);
            
            // Update board
            updateBoard();
            clearHighlights();
            
            // Update timer
            updateTimer();
            
            // Check game over conditions
            checkGameStatus();
            
            // AI move if needed
            if (gameState.gameMode === 'ai' && gameState.currentPlayer !== gameState.playerColor) {
                setTimeout(makeAIMove, 500);
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('highlight', 'possible-move', 'possible-capture');
            });
        }

        // ===== PROMOTION =====
        function showPromotionModal(fromPos, toPos, color) {
            gameState.promotionPending = { fromPos, toPos, color };
            const modal = document.getElementById('promotionModal');
            const options = document.getElementById('promotionOptions');
            options.innerHTML = '';
            
            const pieces = color === 'white' ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];
            
            pieces.forEach(pieceCode => {
                const option = document.createElement('div');
                option.className = 'promotion-piece';
                option.textContent = CHESS_PIECES[pieceCode];
                option.style.color = color === 'white' ? 'white' : '#2C2C2C';
                option.onclick = () => {
                    executeMove(fromPos, toPos, color === 'white' ? 'P' : 'p', pieceCode);
                    modal.style.display = 'none';
                };
                options.appendChild(option);
            });
            
            modal.style.display = 'block';
        }

        // ===== AI =====
        function makeAIMove() {
            if (!gameState.gameActive || gameState.currentPlayer === gameState.playerColor) return;
            
            // Get all pieces of current color
            const aiColor = gameState.playerColor === 'white' ? 'black' : 'white';
            const aiPieces = Object.entries(gameState.pieces)
                .filter(([pos, piece]) => 
                    (piece === piece.toLowerCase()) === (aiColor === 'black'));
            
            if (aiPieces.length === 0) return;
            
            // Try to find a good move (simplified)
            let foundMove = false;
            
            // First, try captures
            for (const [pos, piece] of aiPieces) {
                const moves = getValidMoves(pos, piece);
                const captures = moves.filter(move => gameState.pieces[move.to]);
                
                if (captures.length > 0) {
                    const move = captures[Math.floor(Math.random() * captures.length)];
                    setTimeout(() => executeMove(pos, move.to, piece), 300);
                    foundMove = true;
                    break;
                }
            }
            
            // If no captures, random move
            if (!foundMove) {
                const [pos, piece] = aiPieces[Math.floor(Math.random() * aiPieces.length)];
                const moves = getValidMoves(pos, piece);
                
                if (moves.length > 0) {
                    const move = moves[Math.floor(Math.random() * moves.length)];
                    setTimeout(() => executeMove(pos, move.to, piece), 300);
                }
            }
        }

        // ===== GAME MANAGEMENT =====
        function initTimeModes() {
            const container = document.getElementById('timeModes');
            container.innerHTML = '';
            
            GAME_MODES.forEach((mode, index) => {
                const option = document.createElement('div');
                option.className = `mode-option ${index === 2 ? 'selected' : ''}`;
                option.innerHTML = `
                    <div class="mode-icon">${mode.icon}</div>
                    <div class="mode-name">${mode.name}</div>
                    <div class="mode-time">${Math.floor(mode.time / 60)}+${mode.increment}</div>
                `;
                option.onclick = () => {
                    document.querySelectorAll('.mode-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    option.classList.add('selected');
                    gameState.gameMode = mode;
                };
                container.appendChild(option);
                
                if (index === 2) {
                    gameState.gameMode = mode;
                }
            });
        }

        function startGame() {
            const name = document.getElementById('playerName').value.trim() || 'Игрок';
            const gameType = document.getElementById('gameType').value;
            const color = document.getElementById('playerColor').value;
            
            gameState.playerName = name;
            gameState.gameActive = true;
            gameState.playerColor = color === 'random' ? (Math.random() > 0.5 ? 'white' : 'black') : color;
            gameState.currentPlayer = 'white';
            gameState.moveHistory = [];
            gameState.lastMove = null;
            
            // Set time based on mode
            if (gameState.gameMode) {
                gameState.whiteTime = gameState.gameMode.time;
                gameState.blackTime = gameState.gameMode.time;
            }
            
            // Reset board
            gameState.pieces = { ...INITIAL_POSITION };
            
            // Update UI
            updateBoard();
            updatePlayerInfo();
            clearHistory();
            startTimer();
            updateGameStatus('Игра началась!');
            
            // Handle game type
            if (gameType === 'ai') {
                gameState.opponentName = 'Компьютер';
                if (gameState.playerColor === 'black') {
                    setTimeout(makeAIMove, 1000);
                }
            } else if (gameType === 'friend') {
                gameState.opponentName = 'Друг';
                generateGameCode();
                showNotification('Код игры скопирован! Отправьте другу.', 'info');
            } else {
                gameState.opponentName = 'Онлайн соперник';
                findOnlineOpponent();
            }
            
            hideModal('newGameModal');
            showNotification(`Игра началась! Вы играете ${gameState.playerColor === 'white' ? 'белыми' : 'чёрными'}.`, 'success');
        }

        function generateGameCode() {
            gameState.gameCode = 'CHESS-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('gameCode').value = gameState.gameCode;
            copyGameCode();
        }

        function copyGameCode() {
            navigator.clipboard.writeText(gameState.gameCode);
            showNotification('Код скопирован!', 'info');
        }

        function createFriendGame() {
            const name = document.getElementById('friendName').value.trim() || 'Игрок';
            gameState.playerName = name;
            generateGameCode();
            
            hideModal('friendsModal');
            showNotification(`Игра создана! Код: ${gameState.gameCode}`, 'success');
            
            // Wait for friend to join
            updateGameStatus('Ожидание друга...');
            gameState.gameActive = false;
        }

        function joinFriendGame() {
            const code = document.getElementById('joinGameCode').value.trim().toUpperCase();
            if (!code) {
                showNotification('Введите код игры', 'error');
                return;
            }
            
            const name = document.getElementById('friendName').value.trim() || 'Игрок';
            gameState.playerName = name;
            gameState.gameCode = code;
            
            // In a real app, you would connect to the game here
            hideModal('friendsModal');
            showNotification(`Присоединяемся к игре ${code}...`, 'info');
            
            // Simulate connection
            setTimeout(() => {
                gameState.gameActive = true;
                gameState.playerColor = 'black'; // Second player gets black
                gameState.currentPlayer = 'white';
                gameState.opponentName = 'Друг';
                
                gameState.pieces = { ...INITIAL_POSITION };
                updateBoard();
                updatePlayerInfo();
                startTimer();
                updateGameStatus('Игра началась! Друг ходит первым.');
            }, 1000);
        }

        function findOnlineOpponent() {
            // Simulate finding opponent
            setTimeout(() => {
                gameState.opponentName = 'Соперник#' + Math.floor(Math.random() * 1000);
                updatePlayerInfo();
                showNotification(`Найден соперник: ${gameState.opponentName}`, 'info');
            }, 2000);
        }

        function updatePlayerInfo() {
            // White player
            if (gameState.playerColor === 'white') {
                document.getElementById('whitePlayerName').textContent = gameState.playerName;
                document.getElementById('blackPlayerName').textContent = gameState.opponentName;
            } else {
                document.getElementById('whitePlayerName').textContent = gameState.opponentName;
                document.getElementById('blackPlayerName').textContent = gameState.playerName;
            }
            
            updatePlayerIndicators();
        }

        function updatePlayerIndicators() {
            document.getElementById('whitePlayerInfo').classList.toggle('active', gameState.currentPlayer === 'white');
            document.getElementById('blackPlayerInfo').classList.toggle('active', gameState.currentPlayer === 'black');
        }

        function updateGameStatus(text) {
            document.getElementById('gameStatus').textContent = text;
        }

        // ===== TIMER =====
        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            
            gameState.timerInterval = setInterval(() => {
                if (!gameState.gameActive) return;
                
                if (gameState.currentPlayer === 'white') {
                    gameState.whiteTime--;
                } else {
                    gameState.blackTime--;
                }
                
                updateTimerDisplay();
                
                // Check timeout
                if (gameState.whiteTime <= 0) {
                    endGame('black', 'Время белых вышло!');
                } else if (gameState.blackTime <= 0) {
                    endGame('white', 'Время чёрных вышло!');
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('whiteTimer').textContent = formatTime(gameState.whiteTime);
            document.getElementById('blackTimer').textContent = formatTime(gameState.blackTime);
        }

        function updateTimer() {
            // Add increment
            if (gameState.gameMode && gameState.gameMode.increment > 0) {
                if (gameState.currentPlayer === 'white') {
                    gameState.blackTime += gameState.gameMode.increment;
                } else {
                    gameState.whiteTime += gameState.gameMode.increment;
                }
                updateTimerDisplay();
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ===== MOVE HISTORY =====
        function addMoveToHistory(from, to, piece) {
            const moveNumber = Math.floor(gameState.moveHistory.length / 2) + 1;
            const isWhiteMove = gameState.moveHistory.length % 2 === 0;
            const san = `${piece} ${from}-${to}`;
            
            const container = document.getElementById('movesContainer');
            
            // Clear placeholder
            if (container.querySelector('.fa-chess-board')) {
                container.innerHTML = '';
            }
            
            if (isWhiteMove) {
                const row = document.createElement('div');
                row.className = 'move-row';
                row.innerHTML = `
                    <div class="move-number">${moveNumber}.</div>
                    <div class="move-white">${san}</div>
                    <div class="move-black"></div>
                `;
                container.appendChild(row);
            } else {
                const lastRow = container.lastElementChild;
                if (lastRow) {
                    lastRow.querySelector('.move-black').textContent = san;
                    lastRow.classList.add('current');
                    
                    // Remove current from previous row
                    const prevRows = container.querySelectorAll('.move-row');
                    prevRows.forEach((row, index) => {
                        if (index !== prevRows.length - 1) {
                            row.classList.remove('current');
                        }
                    });
                }
            }
            
            container.scrollTop = container.scrollHeight;
            gameState.moveHistory.push(san);
        }

        function clearHistory() {
            const container = document.getElementById('movesContainer');
            container.innerHTML = `
                <div class="text-center" style="color: #999; padding: 30px 0;">
                    <i class="fas fa-chess-board fa-2x"></i>
                    <p style="margin-top: 10px;">Ходы появятся здесь</p>
                </div>
            `;
            gameState.moveHistory = [];
        }

        // ===== CHAT =====
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message own';
            messageDiv.textContent = `${gameState.playerName}: ${message}`;
            container.appendChild(messageDiv);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;
            
            // AI response
            if (gameState.gameMode === 'ai') {
                setTimeout(() => {
                    const responses = [
                        'Хороший ход!',
                        'Интересно...',
                        'Я думаю над ответом',
                        'Сложная позиция!',
                        'Ты хорошо играешь!'
                    ];
                    
                    const aiMessage = document.createElement('div');
                    aiMessage.className = 'message opponent';
                    aiMessage.textContent = `Компьютер: ${responses[Math.floor(Math.random() * responses.length)]}`;
                    container.appendChild(aiMessage);
                    container.scrollTop = container.scrollHeight;
                }, 1000);
            }
        }

        // ===== GAME CONTROLS =====
        function undoMove() {
            if (gameState.moveHistory.length === 0) {
                showNotification('Нет ходов для отмены', 'info');
                return;
            }
            
            // Simplified undo
            gameState.pieces = { ...INITIAL_POSITION };
            gameState.currentPlayer = 'white';
            gameState.moveHistory = [];
            
            updateBoard();
            clearHistory();
            showNotification('Игра сброшена', 'info');
        }

        function getHint() {
            if (!gameState.gameActive) {
                showNotification('Игра не начата', 'info');
                return;
            }
            
            const hints = [
                'Контролируйте центр доски',
                'Развивайте фигуры в начале',
                'Рокируйтесь для безопасности короля',
                'Создавайте угрозы сопернику',
                'Не оставляйте фигуры без защиты'
            ];
            
            showNotification(`💡 Подсказка: ${hints[Math.floor(Math.random() * hints.length)]}`, 'info');
        }

        function offerDraw() {
            if (!gameState.gameActive) return;
            
            if (confirm('Предложить ничью?')) {
                showNotification('Ничья предложена', 'info');
                addChatMessage('Система', `${gameState.playerName} предлагает ничью`);
            }
        }

        function resignGame() {
            if (!gameState.gameActive) return;
            
            if (confirm('Вы уверены, что хотите сдаться?')) {
                const winner = gameState.playerColor === 'white' ? 'black' : 'white';
                endGame(winner, `${gameState.playerName} сдался`);
                addChatMessage('Система', `${gameState.playerName} сдался!`);
            }
        }

        function checkGameStatus() {
            // Simplified check detection
            // In a real game, implement proper check/checkmate detection
        }

        function endGame(winner, reason) {
            gameState.gameActive = false;
            clearInterval(gameState.timerInterval);
            
            const winnerText = winner === 'white' ? 'Белые' : 'Чёрные';
            updateGameStatus(`${winnerText} победили! ${reason}`);
            showNotification(`Игра окончена! Победили ${winnerText.toLowerCase()}.`, 'success');
            
            playSound(winner === gameState.playerColor ? 'win' : 'lose');
        }

        // ===== SOUND =====
        function playSound(type) {
            if (!gameState.soundEnabled) return;
            
            // Create audio elements for different sounds
            const audio = new Audio();
            let soundFile = '';
            
            switch(type) {
                case 'move': soundFile = 'https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3'; break;
                case 'capture': soundFile = 'https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'; break;
                case 'promotion': soundFile = 'https://assets.mixkit.co/sfx/preview/mixkit-winning-trumpet-2018.mp3'; break;
                case 'check': soundFile = 'https://assets.mixkit.co/sfx/preview/mixkit-warning-alarm-buzzer-2851.mp3'; break;
                case 'win': soundFile = 'https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'; break;
                case 'lose': soundFile = 'https://assets.mixkit.co/sfx/preview/mixkit-retro-game-emergency-alarm-1000.mp3'; break;
            }
            
            if (soundFile) {
                audio.src = soundFile;
                audio.volume = 0.3;
                audio.play().catch(e => console.log('Audio error:', e));
            }
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            const icon = document.getElementById('soundIcon');
            icon.className = gameState.soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
            showNotification(`Звук ${gameState.soundEnabled ? 'включён' : 'выключен'}`, 'info');
        }

        // ===== MODAL FUNCTIONS =====
        function showModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function hideModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // ===== SETTINGS =====
        function loadSettings() {
            const savedName = localStorage.getItem('chessPlayerName');
            if (savedName) {
                gameState.playerName = savedName;
                document.getElementById('playerName').value = savedName;
                document.getElementById('friendName').value = savedName;
            }
            
            gameState.soundEnabled = localStorage.getItem('chessSound') !== 'false';
            const icon = document.getElementById('soundIcon');
            icon.className = gameState.soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        }

        function saveSettings() {
            localStorage.setItem('chessPlayerName', gameState.playerName);
            localStorage.setItem('chessSound', gameState.soundEnabled);
        }

        // ===== GAME LOOP =====
        function gameLoop() {
            // Update online games list periodically
            updateOnlineGames();
            requestAnimationFrame(gameLoop);
        }

        function updateOnlineGames() {
            // Simulate online games
            const games = [
                { id: 1, white: 'Player1', black: 'Player2', time: '5+2', moves: 12 },
                { id: 2, white: 'ChessMaster', black: 'Waiting...', time: '10+5', moves: 0 },
                { id: 3, white: 'AI_Bot', black: 'PlayerX', time: '3+1', moves: 24 }
            ];
            
            const container = document.getElementById('onlineGames');
            container.innerHTML = '';
            
            games.forEach(game => {
                const item = document.createElement('div');
                item.className = 'game-item';
                item.innerHTML = `
                    <div class="game-info">
                        <div class="game-players">${game.white} vs ${game.black}</div>
                        <div class="game-time">${game.time} • ${game.moves} ходов</div>
                    </div>
                `;
                item.onclick = () => {
                    showNotification(`Присоединяемся к игре ${game.id}...`, 'info');
                };
                container.appendChild(item);
            });
        }

        // Auto-save on exit
        window.addEventListener('beforeunload', saveSettings);
    </script>
</body>
</html>
