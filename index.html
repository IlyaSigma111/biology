<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♛ Chess Arena — Битва умов</title>
    <style>
        /* Стили прямо здесь чтобы сразу работало */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0f0f23;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .logo-text h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: #4d7fff;
        }

        .logo-text p {
            color: #b0b0d0;
            font-size: 1rem;
        }

        .game-area {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .board-container {
            flex: 1;
            min-width: 600px;
        }

        .board-wrapper {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #board {
            width: 560px;
            height: 560px;
            margin: 0 auto;
            border: 2px solid #4d7fff;
            border-radius: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            background: #4d7fff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #3567d8;
            transform: translateY(-2px);
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .panel h3 {
            color: #4d7fff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4d7fff;
        }

        .move-history {
            height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .move-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #2a2a3e;
        }

        .chat-messages {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            background: #2a2a3e;
            border: none;
            border-radius: 5px;
            color: white;
        }

        /* Шахматная доска стили */
        .board-b72b1 {
            border: 2px solid #404040;
        }

        .square-55d63 {
            position: relative;
        }

        .white-1e1d7 {
            background-color: #f0d9b5;
        }

        .black-3c85d {
            background-color: #b58863;
        }

        .highlight {
            background-color: rgba(77, 127, 255, 0.5) !important;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f23;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #4d7fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 1.2rem;
            color: #4d7fff;
        }

        .timer {
            font-family: monospace;
            font-size: 1.5rem;
            color: #ff9f1c;
            text-align: center;
            margin: 10px 0;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #2a2a3e;
            border-radius: 8px;
        }

        .player-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .white-color { background: white; }
        .black-color { background: black; }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <h2>♛ Chess Arena</h2>
        <p>Загрузка...</p>
    </div>

    <div class="container" id="main" style="display: none;">
        <div class="header">
            <div class="logo">♛</div>
            <div class="logo-text">
                <h1>CHESS ARENA</h1>
                <p>БИТВА УМОВ</p>
            </div>
        </div>

        <div class="status" id="status">Выберите режим игры</div>

        <div class="game-area">
            <div class="board-container">
                <div class="board-wrapper">
                    <div id="board"></div>
                    
                    <div class="controls">
                        <button onclick="startGame('ai')">🎮 Играть с AI</button>
                        <button onclick="startGame('local')">👥 Локальная игра</button>
                        <button onclick="undoMove()">↶ Отменить ход</button>
                        <button onclick="newGame()">🔄 Новая игра</button>
                    </div>

                    <div class="timer">
                        <span id="whiteTimer">10:00</span> ⚔ <span id="blackTimer">10:00</span>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <h3>🎮 Игроки</h3>
                    <div class="player-info">
                        <div class="player-color white-color"></div>
                        <span id="whitePlayer">Белые (Вы)</span>
                        <span style="margin-left: auto;">Ходы: <span id="whiteMoves">0</span></span>
                    </div>
                    <div class="player-info">
                        <div class="player-color black-color"></div>
                        <span id="blackPlayer">Чёрные (AI)</span>
                        <span style="margin-left: auto;">Ходы: <span id="blackMoves">0</span></span>
                    </div>
                </div>

                <div class="panel">
                    <h3>📜 История ходов</h3>
                    <div class="move-history" id="moveHistory">
                        <div style="text-align: center; color: #888; padding: 20px;">
                            Ходы появятся здесь
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>💬 Чат игры</h3>
                    <div class="chat-messages" id="chat">
                        <div style="color: #4d7fff;">Добро пожаловать в Chess Arena!</div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="Введите сообщение...">
                        <button onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Простая версия игры без внешних библиотек
        let gameState = {
            board: null,
            game: null,
            isPlaying: false,
            mode: null,
            playerColor: 'white',
            whiteTime: 600,
            blackTime: 600,
            timer: null,
            moves: []
        };

        // Инициализация
        function init() {
            console.log("Инициализация шахмат...");
            
            // Создаем доску вручную
            createBoard();
            
            // Скрываем загрузку
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('main').style.display = 'block';
                updateStatus('Готов к игре! Выберите режим.');
            }, 500);
        }

        // Создаем шахматную доску
        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            const size = 560;
            const squareSize = size / 8;
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.style.width = squareSize + 'px';
                    square.style.height = squareSize + 'px';
                    square.style.float = 'left';
                    square.style.backgroundColor = (row + col) % 2 === 0 ? '#f0d9b5' : '#b58863';
                    square.style.position = 'relative';
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.dataset.pos = String.fromCharCode(97 + col) + (8 - row);
                    
                    // Добавляем фигуры в начальной позиции
                    if (row === 1) {
                        addPiece(square, '♟', 'black'); // Черные пешки
                    } else if (row === 6) {
                        addPiece(square, '♙', 'white'); // Белые пешки
                    } else if (row === 0) {
                        // Черные фигуры
                        const pieces = ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'];
                        addPiece(square, pieces[col], 'black');
                    } else if (row === 7) {
                        // Белые фигуры
                        const pieces = ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖'];
                        addPiece(square, pieces[col], 'white');
                    }
                    
                    square.addEventListener('click', () => handleSquareClick(square));
                    board.appendChild(square);
                }
            }
        }

        function addPiece(square, symbol, color) {
            const piece = document.createElement('div');
            piece.textContent = symbol;
            piece.style.fontSize = '40px';
            piece.style.textAlign = 'center';
            piece.style.lineHeight = '70px'; // squareSize = 70
            piece.style.cursor = 'grab';
            piece.style.userSelect = 'none';
            piece.dataset.color = color;
            piece.dataset.type = getPieceType(symbol);
            square.dataset.piece = symbol;
            square.appendChild(piece);
        }

        function getPieceType(symbol) {
            const pieces = {
                '♙': 'pawn', '♟': 'pawn',
                '♖': 'rook', '♜': 'rook',
                '♘': 'knight', '♞': 'knight',
                '♗': 'bishop', '♝': 'bishop',
                '♕': 'queen', '♛': 'queen',
                '♔': 'king', '♚': 'king'
            };
            return pieces[symbol] || 'pawn';
        }

        let selectedSquare = null;

        function handleSquareClick(square) {
            if (!gameState.isPlaying) return;
            
            const piece = square.dataset.piece;
            
            if (selectedSquare) {
                // Пытаемся сделать ход
                makeMove(selectedSquare, square);
                selectedSquare = null;
                clearHighlights();
            } else if (piece) {
                // Выбираем фигуру
                const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                
                // Проверяем, может ли игрок ходить этой фигурой
                if (gameState.mode === 'ai' && gameState.playerColor !== pieceColor) return;
                
                selectedSquare = square;
                highlightSquare(square);
                showPossibleMoves(square);
            }
        }

        function highlightSquare(square) {
            square.style.boxShadow = 'inset 0 0 0 3px #4d7fff';
        }

        function clearHighlights() {
            document.querySelectorAll('#board > div').forEach(sq => {
                sq.style.boxShadow = '';
            });
        }

        function showPossibleMoves(square) {
            // Простая логика возможных ходов
            const piece = square.dataset.piece;
            const type = getPieceType(piece);
            const row = parseInt(square.dataset.row);
            const col = parseInt(square.dataset.col);
            const color = piece === piece.toUpperCase() ? 'white' : 'black';
            
            // Для пешки
            if (type === 'pawn') {
                const direction = color === 'white' ? -1 : 1;
                const targetRow = row + direction;
                
                if (targetRow >= 0 && targetRow < 8) {
                    const forward = document.querySelector(`[data-row="${targetRow}"][data-col="${col}"]`);
                    if (!forward.dataset.piece) {
                        forward.style.boxShadow = 'inset 0 0 0 3px #00ff00';
                    }
                }
            }
        }

        function makeMove(from, to) {
            if (!from.dataset.piece) return;
            
            // Переносим фигуру
            const piece = from.querySelector('div');
            to.appendChild(piece.cloneNode(true));
            from.removeChild(piece);
            to.dataset.piece = from.dataset.piece;
            from.dataset.piece = '';
            
            // Добавляем ход в историю
            const move = {
                from: from.dataset.pos,
                to: to.dataset.pos,
                piece: to.dataset.piece
            };
            
            addMoveToHistory(move);
            
            // Меняем ход
            toggleTurn();
            
            // Если игра с AI
            if (gameState.mode === 'ai' && gameState.playerColor === 'white') {
                setTimeout(makeAIMove, 500);
            }
        }

        function makeAIMove() {
            if (!gameState.isPlaying) return;
            
            // Простой AI - случайный ход
            const pieces = document.querySelectorAll('#board > div[data-piece]');
            const blackPieces = Array.from(pieces).filter(sq => {
                const piece = sq.dataset.piece;
                return piece && piece === piece.toLowerCase(); // Черные фигуры в нижнем регистре
            });
            
            if (blackPieces.length === 0) return;
            
            const randomPiece = blackPieces[Math.floor(Math.random() * blackPieces.length)];
            const possibleMoves = getPossibleMoves(randomPiece);
            
            if (possibleMoves.length > 0) {
                const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                makeMove(randomPiece, randomMove);
            }
        }

        function getPossibleMoves(square) {
            const moves = [];
            const row = parseInt(square.dataset.row);
            const col = parseInt(square.dataset.col);
            const piece = square.dataset.piece;
            const type = getPieceType(piece);
            
            // Простые ходы для каждой фигуры
            if (type === 'pawn') {
                const direction = piece === piece.toLowerCase() ? 1 : -1; // Черные вниз, белые вверх
                const targetRow = row + direction;
                if (targetRow >= 0 && targetRow < 8) {
                    const forward = document.querySelector(`[data-row="${targetRow}"][data-col="${col}"]`);
                    if (!forward.dataset.piece) moves.push(forward);
                }
            } else if (type === 'rook') {
                // Горизонтальные и вертикальные ходы
                for (let i = 0; i < 8; i++) {
                    if (i !== row) moves.push(document.querySelector(`[data-row="${i}"][data-col="${col}"]`));
                    if (i !== col) moves.push(document.querySelector(`[data-row="${row}"][data-col="${i}"]`));
                }
            }
            
            return moves.filter(move => move);
        }

        function addMoveToHistory(move) {
            const history = document.getElementById('moveHistory');
            
            // Убираем placeholder
            if (history.children.length === 1 && history.children[0].textContent.includes('появятся')) {
                history.innerHTML = '';
            }
            
            const moveNumber = Math.floor(gameState.moves.length / 2) + 1;
            const isWhiteMove = gameState.moves.length % 2 === 0;
            
            if (isWhiteMove) {
                const row = document.createElement('div');
                row.className = 'move-row';
                row.innerHTML = `
                    <span>${moveNumber}. ${move.piece} ${move.from}→${move.to}</span>
                    <span style="color: #888">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                `;
                history.appendChild(row);
            } else {
                const lastRow = history.lastElementChild;
                lastRow.innerHTML = `
                    <span>${moveNumber}. ${lastRow.textContent.split('. ')[1].split(' ')[0]} ${move.piece} ${move.from}→${move.to}</span>
                    <span style="color: #888">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                `;
            }
            
            gameState.moves.push(move);
            updateMoveCounts();
            
            // Скроллим вниз
            history.scrollTop = history.scrollHeight;
        }

        function updateMoveCounts() {
            const whiteMoves = gameState.moves.filter(m => {
                const piece = m.piece;
                return piece && piece === piece.toUpperCase(); // Белые в верхнем регистре
            }).length;
            
            const blackMoves = gameState.moves.length - whiteMoves;
            
            document.getElementById('whiteMoves').textContent = whiteMoves;
            document.getElementById('blackMoves').textContent = blackMoves;
        }

        function toggleTurn() {
            const turn = document.getElementById('status').textContent.includes('белых') ? 'черных' : 'белых';
            updateStatus(`Ход ${turn}`);
        }

        function startGame(mode) {
            gameState.mode = mode;
            gameState.isPlaying = true;
            gameState.moves = [];
            
            // Сбрасываем доску
            createBoard();
            
            // Настраиваем имена игроков
            if (mode === 'ai') {
                gameState.playerColor = 'white';
                document.getElementById('whitePlayer').textContent = 'Белые (Вы)';
                document.getElementById('blackPlayer').textContent = 'Чёрные (AI)';
                updateStatus('Ваш ход (белые)');
            } else {
                document.getElementById('whitePlayer').textContent = 'Белые (Игрок 1)';
                document.getElementById('blackPlayer').textContent = 'Чёрные (Игрок 2)';
                updateStatus('Ход белых');
            }
            
            // Сбрасываем счетчики
            document.getElementById('whiteMoves').textContent = '0';
            document.getElementById('blackMoves').textContent = '0';
            document.getElementById('moveHistory').innerHTML = `
                <div style="text-align: center; color: #888; padding: 20px;">
                    Ходы появятся здесь
                </div>
            `;
            
            // Запускаем таймер
            startTimer();
            
            addChatMessage('Система', `Игра началась! Режим: ${mode === 'ai' ? 'против AI' : 'два игрока'}`);
        }

        function startTimer() {
            if (gameState.timer) clearInterval(gameState.timer);
            
            gameState.whiteTime = 600;
            gameState.blackTime = 600;
            
            updateTimers();
            
            gameState.timer = setInterval(() => {
                if (document.getElementById('status').textContent.includes('белых')) {
                    gameState.whiteTime--;
                } else {
                    gameState.blackTime--;
                }
                
                updateTimers();
                
                // Проверяем время
                if (gameState.whiteTime <= 0) {
                    endGame('black', 'Время белых вышло!');
                } else if (gameState.blackTime <= 0) {
                    endGame('white', 'Время черных вышло!');
                }
            }, 1000);
        }

        function updateTimers() {
            document.getElementById('whiteTimer').textContent = formatTime(gameState.whiteTime);
            document.getElementById('blackTimer').textContent = formatTime(gameState.blackTime);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function endGame(winner, reason) {
            if (gameState.timer) clearInterval(gameState.timer);
            gameState.isPlaying = false;
            
            updateStatus(`🎉 Победа ${winner === 'white' ? 'белых' : 'черных'}! ${reason}`);
            addChatMessage('Система', `Игра окончена! ${reason}`);
        }

        function undoMove() {
            if (gameState.moves.length === 0) {
                addChatMessage('Система', 'Нет ходов для отмены');
                return;
            }
            
            const lastMove = gameState.moves.pop();
            addChatMessage('Система', `Ход отменен: ${lastMove.piece} ${lastMove.from}→${lastMove.to}`);
            updateMoveCounts();
            
            // TODO: Реализовать реальную отмену хода
            updateStatus('Ход отменен');
        }

        function newGame() {
            if (gameState.timer) clearInterval(gameState.timer);
            gameState.isPlaying = false;
            gameState.moves = [];
            
            createBoard();
            updateStatus('Выберите режим игры');
            updateTimers();
            
            document.getElementById('whiteMoves').textContent = '0';
            document.getElementById('blackMoves').textContent = '0';
            document.getElementById('moveHistory').innerHTML = `
                <div style="text-align: center; color: #888; padding: 20px;">
                    Ходы появятся здесь
                </div>
            `;
            
            addChatMessage('Система', 'Новая игра готова к началу!');
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                addChatMessage('Вы', message);
                input.value = '';
                
                // Ответ AI
                if (gameState.mode === 'ai' && gameState.isPlaying) {
                    const responses = [
                        'Хороший ход!',
                        'Интересно...',
                        'Думаю над ответом',
                        'Сложная позиция!',
                        'У тебя хорошо получается!'
                    ];
                    
                    setTimeout(() => {
                        addChatMessage('AI', responses[Math.floor(Math.random() * responses.length)]);
                    }, 1000);
                }
            }
        }

        function addChatMessage(sender, message) {
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            messageDiv.style.marginBottom = '5px';
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // Запуск при загрузке
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
